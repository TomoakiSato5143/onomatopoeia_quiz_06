<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>オノマトペクイズ</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden; /* 画面の揺れ防止 */
        }

        .quiz-container {
            background-color: #f7f8f9;
            width: 100%;
            height: 100dvh; /* 動的ビューポート */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 閉じるボタンを少し小さく */
        #close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            font-size: 0.8rem;
            color: #ccc;
            z-index: 10;
        }

        .quiz-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* 上詰めに変更 */
            align-items: center;
            padding: 40px 15px 0; /* 上の余白を少し詰める */
        }

        h1 {
            font-size: 1.1rem;
            margin: 0 0 10px 0; /* タイトルの上下余白を最小に */
            color: #333;
        }
        
        /* 動画をさらに一回り小さく調整 */
        #video-container {
            max-width: 360px; 
            width: 85%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #choices-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px; /* 隙間を狭く */
            width: 100%;
            max-width: 450px;
        }
        
        .choice-btn {
            background-color: #fff;
            border: none;
            border-radius: 30px;
            padding: 10px 5px; /* ボタンを低く */
            font-size: 0.95rem;
            font-weight: bold;
            color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        /* 結果と次へボタンをまとめるエリア */
        .bottom-action-area {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-height: 80px; /* ここがガタつかないように高さを確保 */
        }

        #result-area {
            font-weight: bold;
            font-size: 1.1rem;
            height: 24px;
        }
        
        /* 次へボタンをコンパクトに */
        #next-btn {
            display: none;
            padding: 10px 30px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .correct { color: #5f6cec; }
        .incorrect { color: #e60033; }

        /* フッターの装飾を大幅にカット */
        footer {
            width: 100%;
            margin-top: auto;
        }

        .footer-line {
            width: 50%;
            height: 1px;
            background-color: #ddd;
            margin: 0 auto;
        }

        .footer-text {
            font-size: 0.55rem;
            color: #aaa;
            margin: 5px 0;
        }

        .footer-gradient {
            width: 100%;
            height: 30px; /* 30pxまで縮小 */
            background: linear-gradient(to top, #5f6cec, #f7f8f9);
        }

        /* 画面の縦が特に短い場合の最終調整 */
        @media (max-height: 600px) {
            h1 { font-size: 1rem; }
            #video-container { max-width: 300px; }
            .choice-btn { padding: 8px 5px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <button id="close-btn" onclick="window.close()">× おわる</button>

        <div class="quiz-content">
            <h1>この どうがの オノマトペは どれ？</h1>
            
            <div id="video-container"></div>

            <div id="choices-container"></div>

            <div class="bottom-action-area">
                <div id="result-area"></div>
                <button id="next-btn" onclick="location.reload();">つぎの もんだいへ</button>
            </div>
        </div>

        <footer>
            <div class="footer-line"></div>
            <p class="footer-text">URYUYAMA JLS ONOMATOPOEIA LAB</p>
            <div class="footer-gradient"></div>
        </footer>
    </div>
